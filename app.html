function livePreview(){
  const text=document.getElementById('imp-text').value;
  const nameHint=document.getElementById('imp-name').value.trim();
  importParsed=parseRecipeText(text,nameHint);
  const p=importParsed;
  const box=document.getElementById('imp-preview');
  if(!text.trim()){box.innerHTML='';return;}
  let h='<div class="parse-preview">';
  h+=`<div class="pv-h">Wykryta nazwa</div><div class="pv-title">${esc(p.name||'(brak — podaj ręcznie)')}</div>`;
  const groups=p.ingredientGroups&&p.ingredientGroups.length?p.ingredientGroups:[{title:'',sub:false,items:p.ingredients||[]}];
  const totalIngs=groups.reduce((a,g)=>a+g.items.length,0);
  h+=`<div class="pv-h">Składniki (${totalIngs})</div>`;
  groups.forEach(g=>{
    if(g.title)h+=`<div style="font-weight:600;font-size:12.5px;color:var(--accent-ink);margin:6px 0 2px">${g.sub?'↳ ':''}${esc(g.title)}</div>`;
    h+='<ul>';
    g.items.slice(0,40).forEach(i=>{const pp=parseIngredientLine(i);h+=`<li>${pp.qty!=null?'<b>'+fmtQty(pp.qty)+(pp.unit?' '+esc(pp.unit):'')+'</b> ':''}${esc(pp.name)}</li>`;});
    h+='</ul>';
  });
  h+=`<div class="pv-h">Kroki (${p.steps.length})</div><ul>`;
  p.steps.slice(0,30).forEach((s,i)=>h+=`<li>${i+1}. ${esc(s.slice(0,90))}${s.length>90?'…':''}</li>`);
  h+='</ul></div>';
  box.innerHTML=h;
}

/* Parser tekstu przepisu. Zwraca {name, ingredients:[], steps:[]} */
function parseRecipeText(text,nameHint){
  text=(text||'').trim();
  // 1) spróbuj JSON-LD / JSON (użytkownik wkleił blok danych)
  const jsonld=tryParseJsonLd(text);
  if(jsonld) return jsonld;

  const lines=text.split(/\r?\n/).map(l=>l.trim());
  const result={name:nameHint||'',ingredients:[],ingredientGroups:[],steps:[]};

  // Nagłówki sekcji — dopasowują TYLKO gdy cała linia to nagłówek
  // (samo słowo, ewentualnie z dwukropkiem/myślnikiem), NIE zdanie zaczynające się od tego słowa.
  const ingHead=/^(składniki|skladniki|ingredients|lista zakupów)\s*[:：-]?\s*$/i;
  const stepHead=/^(przygotowanie|sposób przygotowania|sposob przygotowania|sposób wykonania|wykonanie|instrukcje|kroki|preparation|instructions|method|directions)\s*[:：-]?\s*$/i;
  const skipHead=/^(porcje|ilość porcji|liczba porcji|czas|czas przygotowania|czas gotowania|kuchnia|trudność|kalorie|servings|prep time|cook time|total time)\s*[:：-]?\s*.*$/i;

  let mode='pre'; // pre | ing | step
  const preLines=[];
  // grupy składników: pierwsza to główna (bez tytułu)
  let curGroup={title:'',sub:false,items:[]};
  result.ingredientGroups.push(curGroup);

  for(let raw of lines){
    if(!raw){continue;}
    if(ingHead.test(raw)){mode='ing';continue;}
    if(stepHead.test(raw)){mode='step';continue;}
    if(mode==='pre'&&skipHead.test(raw)){continue;} // metadane pomijamy tylko w preambule

    if(mode==='pre'){preLines.push(raw);continue;}

    if(mode==='ing'){
      const clean=cleanIng(raw);
      // Czy to podnagłówek sekcji składników? (krótka linia, bez liczby na początku,
      // bez przecinków-wyliczeń, np. "Sos", "Marynata", "Do podania")
      if(isIngredientSubheader(clean)){
        curGroup={title:clean.replace(/[:：]\s*$/,''),sub:true,items:[]};
        result.ingredientGroups.push(curGroup);
      }else{
        curGroup.items.push(clean);
        result.ingredients.push(clean); // płaska lista dla podglądu wstecznie
      }
      continue;
    }
    if(mode==='step'){result.steps.push(cleanStep(raw));continue;}
  }

  // nazwa z pierwszej linii preambuły jeśli brak
  if(!result.name && preLines.length){result.name=preLines[0];}

  // FALLBACK: brak nagłówków — heurystyka
  if(!result.ingredients.length && !result.steps.length){
    const guess=heuristicSplit(lines.filter(Boolean),result.name);
    if(!result.name&&guess.name)result.name=guess.name;
    result.ingredients=guess.ingredients.filter(i=>i!==result.name);
    result.steps=guess.steps.filter(s=>s!==result.name);
    result.ingredientGroups=[{title:'',sub:false,items:result.ingredients.slice()}];
  }
  // sprzątanie
  result.ingredients=result.ingredients.filter(Boolean);
  result.steps=result.steps.filter(Boolean);
  result.ingredientGroups=result.ingredientGroups
    .map(g=>({...g,items:g.items.filter(Boolean)}))
    .filter(g=>g.items.length||(g.title&&g.title.trim()));
  if(!result.ingredientGroups.length)result.ingredientGroups=[{title:'',sub:false,items:[]}];
  return result;
}
/* Czy linia w sekcji składników jest podnagłówkiem (np. "Sos", "Marynata")?
   Kryteria: krótka, nie zaczyna się od liczby/ułamka/miary, brak przecinków (nie wyliczenie),
   niewiele słów. */
function isIngredientSubheader(l){
  if(!l)return false;
  if(l.length>40)return false;
  if(/^\d/.test(l))return false;                          // zaczyna się od liczby -> składnik
  if(l.includes(','))return false;                        // wyliczenie -> składnik
  const clean=l.replace(/[:：]\s*$/,'').trim();
  const words=clean.split(/\s+/);
  const first=words[0].toLowerCase();
  // pierwsze słowo to miara słowna -> to składnik, nie nagłówek
  const measureWords=['½','¼','¾','⅓','⅔','pół','ćwierć','garść','garśc','szczypta','kilka','trochę','troche','odrobina','odrobinę','sporo','plaster','plasterek','kostka','listek','listków'];
  if(measureWords.includes(first))return false;
  if(words.length>4)return false;                         // za długie na nagłówek
  // typowe słowa-nagłówki
  const knownHead=/^(sos|marynata|marynaty|przyprawy|dressing|dip|glazura|posypka|farsz|nadzienie|ciasto|krem|polewa|baza|dodatki)\b/i;
  if(knownHead.test(clean))return true;
  if(/^(do )(podania|dekoracji|serwowania|posypania|smaku)/i.test(clean))return true;
  if(/^(na wierzch|do środka)/i.test(clean))return true;
  // krótka fraza (1-2 słowa) bez czasownika kuchennego i bez małej litery na starcie zdania
  const kitchenVerb=/(wymieszać|dodać|pokroić|smażyć|gotować|zmiksować|ubić|podać|obsmażyć|namoczyć|posiekać)/i;
  if(words.length<=2 && !kitchenVerb.test(clean))return true;
  return false;
}
function cleanIng(l){return l.replace(/^[-–•*·▪◦]\s*/,'').trim();}
function cleanStep(l){return l.replace(/^\d+[\.\)]\s*/,'').replace(/^(krok\s*\d+[:.\)]?\s*)/i,'').replace(/^[-–•*]\s*/,'').trim();}

/* Heurystyka gdy brak nagłówków:
   - krótkie linie (z liczbą/jednostką lub <60 znaków, bez kropki na końcu) => składniki
   - długie zdania (z kropką, >60 znaków, czasowniki) => kroki */
function heuristicSplit(lines,haveName){
  const out={name:'',ingredients:[],steps:[]};
  let rest=lines.slice();
  // jeśli nie znamy nazwy, pierwsza linia to najpewniej tytuł — zdejmij ją i nie klasyfikuj
  if(!haveName&&rest.length){out.name=rest[0];rest=rest.slice(1);}
  const stepVerb=/\b(dodaj|dodać|wymieszaj|wymieszać|gotuj|ugotuj|gotować|podsmaż|smaż|usmaż|smażyć|piecz|upiecz|piec|zdejmij|zdjąć|marynuj|marynować|pokrój|pokroić|kroić|podawaj|podać|wlej|wlać|posiekaj|siekać|dopraw|doprawić|odstaw|odstawić|wstaw|wstawić|zagotuj|dolej|odsącz|odcedź|schłodź|wymieszać|rozgrzej|natrzyj|natrzeć|obtocz|zblenduj|zmiksuj|przełóż|posyp|polej|dus|dusić)\b/i;
  rest.forEach(l=>{
    const numbered=/^\d+[\.\)]/.test(l);
    const hasQty=/^\d+(?:[.,\/]\d+)?\s*[a-ząćęłńóśźż]{0,8}\b/i.test(l) || /^(garść|szczypta|kilka|trochę|pół|ćwierć)\b/i.test(l);
    const hasVerb=stepVerb.test(l);
    // krok = numerowany, ALBO ma czasownik-instrukcję, ALBO długie zdanie z interpunkcją
    const looksLikeStep = numbered || (hasVerb && !hasQty) || (l.length>55 && /[.!,]/.test(l) && !hasQty);
    if(looksLikeStep){out.steps.push(cleanStep(l));}
    else{out.ingredients.push(cleanIng(l));}
  });
  return out;
}

/* JSON-LD schema.org/Recipe */
function tryParseJsonLd(text){
  // wyłap {...} jeśli wygląda na JSON
  let jsonText=null;
  const t=text.trim();
  if(t.startsWith('{')||t.startsWith('[')){jsonText=t;}
  else{
    const m=t.match(/\{[\s\S]*"recipeIngredient"[\s\S]*\}/i);
    if(m)jsonText=m[0];
  }
  if(!jsonText)return null;
  try{
    let data=JSON.parse(jsonText);
    // znajdź obiekt Recipe
    let rec=findRecipeObj(data);
    if(!rec)return null;
    const name=rec.name||'';
    const ings=(rec.recipeIngredient||rec.ingredients||[]).map(String);
    let steps=[];
    const inst=rec.recipeInstructions;
    if(Array.isArray(inst)){
      inst.forEach(s=>{if(typeof s==='string')steps.push(s);else if(s.text)steps.push(s.text);else if(s.itemListElement){s.itemListElement.forEach(e=>{if(e.text)steps.push(e.text)});}});
    }else if(typeof inst==='string'){steps=inst.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);}
    const flatIngs=ings.map(cleanIng).filter(Boolean);
    return {name,ingredients:flatIngs,ingredientGroups:[{title:'',sub:false,items:flatIngs}],steps:steps.map(cleanStep).filter(Boolean)};
  }catch(e){return null;}
}
function findRecipeObj(data){
  if(!data)return null;
  if(Array.isArray(data)){for(const d of data){const r=findRecipeObj(d);if(r)return r;}return null;}
  if(typeof data==='object'){
    const type=data['@type'];
    if(type&&(type==='Recipe'||(Array.isArray(type)&&type.includes('Recipe'))))return data;
    if(data['@graph'])return findRecipeObj(data['@graph']);
    if(data.recipeIngredient)return data;
  }
  return null;
}

function acceptImport(){
  const text=document.getElementById('imp-text').value;
  const nameHint=document.getElementById('imp-name').value.trim();
  const p=parseRecipeText(text,nameHint);
  if(!p.name && !p.ingredients.length && !p.steps.length){toast('Nie udało się nic wykryć — sprawdź tekst',true);return;}
  // zbuduj grupy składników z zachowaniem podsekcji (np. "Sos")
  const groups=(p.ingredientGroups&&p.ingredientGroups.length?p.ingredientGroups:[{title:'',sub:false,items:p.ingredients||[]}])
    .map(g=>({
      title:g.title||'',sub:!!g.sub,
      items:(g.items.length?g.items:[]).map(l=>{const pp=parseIngredientLine(l);return {raw:l,qty:pp.qty,unit:pp.unit,name:pp.name,linkId:null};})
    }));
  if(!groups.length||!groups.some(g=>g.items.length))groups.push({title:'',sub:false,items:[{raw:'',qty:null,unit:'',name:'',linkId:null}]});
  editorState={
    id:uid(),name:p.name||'',tags:{cuisine:[],dish:[]},baseServings:null,
    ingredientGroups:groups,
    steps:p.steps.length?p.steps:[''],notes:'',createdAt:Date.now(),updatedAt:Date.now(),_isNew:true
  };
  paintEditor();
}

/* =========================================================================
   EKSPORT / IMPORT pliku
   ========================================================================= */
function exportData(){
  const payload={format:'kartoteka',version:1,exportedAt:new Date().toISOString(),recipes};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='receptura-przepisy-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
  toast('Wyeksportowano '+recipes.length+' '+plural(recipes.length,'przepis','przepisy','przepisów'));
}
async function importData(e){
  const file=e.target.files[0];if(!file)return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    let incoming=Array.isArray(data)?data:(data.recipes||[]);
    if(!Array.isArray(incoming)||!incoming.length){toast('Plik nie zawiera przepisów',true);return;}
    const mode=recipes.length?
      (confirm('Masz już '+recipes.length+' przepisów.\n\nOK = DODAJ wczytane do istniejących\nAnuluj = ZASTĄP wszystkie wczytanymi')?'merge':'replace')
      :'merge';
    if(mode==='replace'){
      for(const r of recipes)await dbDelete(r.id);
    }
    let added=0;
    for(const r of incoming){
      if(!r.id)r.id=uid();
      // przy merge: jeśli id koliduje, nadaj nowe
      if(mode==='merge'&&recipes.some(x=>x.id===r.id))r.id=uid();
      // walidacja minimalna
      r.name=r.name||'Bez nazwy';
      r.tags=r.tags||{cuisine:[],dish:[]};
      r.ingredientGroups=r.ingredientGroups||[{title:'',sub:false,items:[]}];
      r.steps=r.steps||[];
      r.createdAt=r.createdAt||Date.now();r.updatedAt=r.updatedAt||Date.now();
      await dbPut(r);added++;
    }
    recipes=await dbGetAll();
    toast((mode==='replace'?'Zastąpiono — wczytano ':'Dodano ')+added+' '+plural(added,'przepis','przepisy','przepisów'));
    goHome();
  }catch(err){toast('Błąd wczytywania pliku',true);console.error(err);}
  e.target.value='';
}

   Wyszukiwanie + start

document.getElementById('searchbox').addEventListener('input',e=>{
  searchQuery=e.target.value.trim();
  if(location.hash&&location.hash!=='#')goHome();
  else renderList();

/* odśwież gdy inna karta zmieni dane */
let bc=null;
try{bc=new BroadcastChannel('kartoteka');bc.onmessage=async()=>{recipes=await dbGetAll();route();};}catch(e){}
const origPut=dbPut, origDel=dbDelete;
// powiadamiaj inne karty po zapisie/usunięciu
function notify(){try{bc&&bc.postMessage('changed');}catch(e){}}

(async function init(){
  await openDB();
  recipes=await dbGetAll();
  route();
})();

/* opakuj dbPut/dbDelete żeby wysyłały notyfikację (po zdefiniowaniu notify) */
const _put=dbPut, _del=dbDelete;
dbPut=async(r)=>{await _put(r);notify();};
dbDelete=async(id)=>{await _del(id);notify();};

/* ---------- PWA: rejestracja service workera (tylko gdy hostowane po http/https) ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW rejestracja nieudana:',err));
  });
}
